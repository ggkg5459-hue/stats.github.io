<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Статистика повітряних тривог</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-color: #fdfbf7;
            --text-color: #2c3e50;
            --container-bg: #ffffff;
            --box-bg-1: #fff3cd;
            --box-text-1: #856404;
            --box-border-1: #ffc107;
            --box-bg-2: #d1ecf1;
            --box-text-2: #0c5460;
            --box-border-2: #17a2b8;
            --btn-bg: #e9ecef;
            --btn-text: #495057;
            --btn-active-bg: #900020;
            --btn-active-text: #ffffff;
            --grid-color: rgba(0, 0, 0, 0.1);
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-color: #121212;
                --text-color: #e0e0e0;
                --container-bg: #1e1e1e;
                --box-bg-1: #332b00;
                --box-text-1: #ffda6a;
                --box-border-1: #b38600;
                --box-bg-2: #002b36;
                --box-text-2: #63d4eb;
                --box-border-2: #007c91;
                --btn-bg: #2c2c2c;
                --btn-text: #e0e0e0;
                --grid-color: rgba(255, 255, 255, 0.1);
            }
        }

        body { font-family: 'Segoe UI', Tahoma, Arial, sans-serif; background-color: var(--bg-color); color: var(--text-color); margin: 0; padding: 20px; transition: 0.3s; }
        .container { max-width: 1000px; margin: 0 auto; background: var(--container-bg); padding: 30px; border-radius: 12px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); position: relative; transition: 0.3s; }
        
        .header-actions { position: absolute; top: 20px; right: 20px; display: flex; align-items: center; gap: 15px; }
        .last-update-text { font-size: 0.85em; color: #888; font-weight: 500; }
        .lang-btn { background: var(--btn-bg); color: var(--btn-text); border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-weight: bold; transition: 0.2s; }
        .lang-btn:hover { opacity: 0.8; }

        h1 { text-align: center; margin-bottom: 30px; margin-top: 10px; }
        
        .stats-summary { display: flex; justify-content: space-between; margin-bottom: 30px; gap: 20px; }
        .stat-box { flex: 1; background: var(--box-bg-1); border-left: 5px solid var(--box-border-1); padding: 20px; border-radius: 8px; text-align: center; font-size: 1.2em; font-weight: bold; color: var(--box-text-1); transition: 0.3s; }
        .stat-box.duration { background: var(--box-bg-2); border-left: 5px solid var(--box-border-2); color: var(--box-text-2); }
        .stat-box span { display: block; font-size: 2.2em; margin-top: 10px; }

        .controls { display: flex; justify-content: center; flex-wrap: wrap; gap: 10px; margin-bottom: 20px; }
